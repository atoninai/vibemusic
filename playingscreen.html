<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Main Player View with Compact Island</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5b13ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#161022",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom styles for glassmorphism and blurs that might exceed standard utility classes */
        .glass-panel {
            background: rgba(22, 16, 34, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .ambient-glow {
            background: radial-gradient(circle at center, rgba(91, 19, 236, 0.25) 0%, rgba(22, 16, 34, 0) 70%);
        }

        /* Simulating the dynamic island notch area */
        .notch-area {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 50;
        }

        /* Custom range input styling for the progress bar */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #fff;
            margin-top: -4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-white font-display min-h-screen flex flex-col justify-between overflow-hidden relative selection:bg-primary selection:text-white">
<!-- Background Ambient Effects -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<!-- Main Ambient Blob Top Left -->
<div class="absolute -top-[10%] -left-[20%] w-[120%] h-[80%] rounded-full bg-primary/20 blur-[120px] opacity-40 mix-blend-screen"></div>
<!-- Secondary Ambient Blob Bottom Right -->
<div class="absolute top-[40%] -right-[10%] w-[100%] h-[70%] rounded-full bg-indigo-500/10 blur-[100px] opacity-30"></div>
</div>
<!-- Status Bar Area (Simulated) -->
<div class="relative z-50 px-6 pt-3 flex justify-between items-center text-xs font-medium tracking-wide opacity-90 text-white">
<span>9:41</span>
<div class="flex items-center gap-1.5">
<span class="material-icons-round text-[16px]">signal_cellular_alt</span>
<span class="material-icons-round text-[16px]">wifi</span>
<span class="material-icons-round text-[18px] rotate-90">battery_full</span>
</div>
</div>
<!-- Dynamic Island (Compact State) -->
<!-- This sits absolutely positioned at the top center, simulating the hardware integration -->
<div class="absolute top-[11px] left-1/2 -translate-x-1/2 z-[60]">
<div class="bg-black rounded-full h-[36px] min-w-[126px] flex items-center justify-between px-3 shadow-2xl transition-all duration-300 ease-out hover:w-[200px] hover:h-[48px] cursor-pointer group">
<!-- Left Icon: Playing State -->
<div class="flex items-end gap-[2px] h-3 w-4">
<div class="w-[3px] bg-primary rounded-full animate-[pulse_1s_ease-in-out_infinite] h-full"></div>
<div class="w-[3px] bg-primary/70 rounded-full animate-[pulse_1.5s_ease-in-out_infinite] h-2/3"></div>
<div class="w-[3px] bg-primary/40 rounded-full animate-[pulse_0.8s_ease-in-out_infinite] h-1/2"></div>
</div>
<!-- Center Text (Hidden in compact, appears on expand) -->
<div class="hidden group-hover:block text-[10px] font-semibold text-white/80 whitespace-nowrap mx-2 truncate">
                Midnight City
            </div>
<!-- Right Icon: Mini Waveform -->
<div class="relative">
<span class="material-icons-round text-primary text-sm animate-spin">graphic_eq</span>
</div>
</div>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-6 z-10 w-full max-w-md mx-auto relative pt-8 pb-4">
<!-- Top Toolbar -->
<div class="w-full flex justify-between items-center mb-6">
<button class="p-3 rounded-full hover:bg-white/10 transition-colors text-white/60 hover:text-white">
<span class="material-icons-round">keyboard_arrow_down</span>
</button>
<div class="text-xs uppercase tracking-widest font-bold text-white/40">Now Playing</div>
<button class="p-3 rounded-full hover:bg-white/10 transition-colors text-white/60 hover:text-white">
<span class="material-icons-round">more_horiz</span>
</button>
</div>
<!-- Album Art Container -->
<div class="relative w-full aspect-square mb-10 group perspective-1000">
<!-- Glow Effect behind the art -->
<div class="absolute inset-4 bg-primary/40 rounded-full blur-2xl opacity-60 group-hover:opacity-80 transition-opacity duration-700"></div>
<!-- Album Art Image -->
<div class="relative w-full h-full rounded-2xl overflow-hidden shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] border border-white/10 transform transition-transform duration-500 hover:scale-[1.02]">
<img alt="Abstract neon dark gradient album cover art" class="w-full h-full object-cover" data-alt="Abstract neon dark gradient album cover art" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB1HOjmma7Zu0p0ry7AGTJ4j5xQ1zGVFZyrSXoKFAruc3SzH-IhZpZ13bHjBZzNRX6jmaxVCFxrNiehZB34RnjOYYhajd233Rgs1-BgEuT_elmm34O0Tcr0JyWbkv8CXc0nSAzfeFCBvm9OzQ85psg7YrzET7EJvTB2Ihh4kh60c-MdIi_wsDukRBiHyNLdJkckNJfO_jJOxm5ClgRZMqtyjw5jmSJK3brbK_UBM7PXLMDxP2BWzFmVBvUL1fqoGAMSxLVJyJGJ0GA"/>
</div>
</div>
<!-- Track Info & Primary Controls -->
<div class="w-full space-y-2">
<div class="flex justify-between items-end mb-2">
<div class="flex flex-col">
<h1 class="text-2xl font-bold text-white tracking-tight leading-tight">Midnight City</h1>
<p class="text-lg text-white/50 font-medium">M83</p>
</div>
<button class="p-2 -mr-2 text-primary hover:text-white transition-colors">
<span class="material-icons-round">favorite</span>
</button>
</div>
</div>
<!-- Progress Bar -->
<div class="w-full mt-6 mb-2">
<div class="relative w-full h-1 bg-white/10 rounded-full cursor-pointer group">
<!-- Buffered Progress -->
<div class="absolute left-0 top-0 h-full w-2/3 bg-white/10 rounded-full"></div>
<!-- Play Progress -->
<div class="absolute left-0 top-0 h-full w-1/3 bg-primary rounded-full relative">
<!-- Thumb (Only visible on hover or active) -->
<div class="absolute right-[-6px] top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow-[0_0_10px_rgba(91,19,236,0.5)] scale-100 transition-transform"></div>
</div>
</div>
<div class="flex justify-between text-[11px] font-medium text-white/30 mt-2 font-mono tracking-wide">
<span>1:24</span>
<span>4:03</span>
</div>
</div>
<!-- Playback Controls -->
<div class="w-full flex items-center justify-between mt-6 px-2">
<!-- Shuffle -->
<button class="text-white/40 hover:text-primary transition-colors">
<span class="material-icons-round text-2xl">shuffle</span>
</button>
<!-- Main Controls Group -->
<div class="flex items-center gap-6">
<button class="text-white hover:text-primary transition-colors hover:scale-110 active:scale-95 transform duration-200">
<span class="material-icons-round text-4xl">skip_previous</span>
</button>
<button class="w-16 h-16 rounded-full bg-primary text-white flex items-center justify-center shadow-[0_0_30px_rgba(91,19,236,0.4)] hover:shadow-[0_0_50px_rgba(91,19,236,0.6)] hover:scale-105 active:scale-95 transition-all duration-300 group">
<span class="material-icons-round text-4xl ml-1 group-hover:scale-110 transition-transform">play_arrow</span>
</button>
<button class="text-white hover:text-primary transition-colors hover:scale-110 active:scale-95 transform duration-200">
<span class="material-icons-round text-4xl">skip_next</span>
</button>
</div>
<!-- Repeat -->
<button class="text-white/40 hover:text-white transition-colors">
<span class="material-icons-round text-2xl">repeat</span>
</button>
</div>
</main>
<!-- Bottom Actions / Output -->
<div class="w-full px-6 pb-8 pt-2 z-10">
<div class="flex justify-between items-center text-white/50">
<button class="flex items-center gap-2 hover:text-white transition-colors p-2 rounded-lg hover:bg-white/5">
<span class="material-icons-round text-xl">lyrics</span>
</button>
<button class="flex items-center gap-2 text-primary bg-primary/10 px-4 py-1.5 rounded-full text-xs font-bold tracking-wide hover:bg-primary/20 transition-colors">
<span class="material-icons-round text-sm">headphones</span>
<span>AirPods Pro</span>
</button>
<button class="flex items-center gap-2 hover:text-white transition-colors p-2 rounded-lg hover:bg-white/5">
<span class="material-icons-round text-xl">queue_music</span>
</button>
</div>
</div>
</body></html>
