<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Expanded Dynamic Island Controls</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#5b13ec",
                "background-light": "#f6f6f8",
                "background-dark": "#161022",
              },
              fontFamily: {
                "display": ["Spline Sans", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "3xl": "2.5rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        /* Custom scrollbar hiding for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Simulating the waveform animation bars */
        .waveform-bar {
            width: 3px;
            background-color: #5b13ec;
            border-radius: 9999px;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .waveform-bar:nth-child(odd) {
            background-color: rgba(91, 19, 236, 0.5); 
            animation-duration: 0.9s;
        }
        .waveform-bar:nth-child(2n) { animation-duration: 1.1s; }
        .waveform-bar:nth-child(3n) { animation-duration: 1.3s; }
        .waveform-bar:nth-child(4n) { animation-duration: 0.8s; }

        @keyframes bounce {
            0%, 100% { height: 12px; opacity: 0.5; }
            50% { height: 24px; opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display min-h-screen relative overflow-hidden flex flex-col items-center justify-start pt-4">
<!-- Background Content (Simulating the App underneath) -->
<div class="absolute inset-0 z-0 opacity-20 filter blur-sm pointer-events-none">
<div class="h-full w-full bg-[url('https://images.unsplash.com/photo-1493225255756-d9584f8606e9?q=80&amp;w=2670&amp;auto=format&amp;fit=crop')] bg-cover bg-center" data-alt="Abstract blurry music background"></div>
</div>
<!-- Dimming Overlay -->
<div class="absolute inset-0 z-10 bg-background-dark/80 backdrop-blur-sm"></div>
<!-- MAIN CONTENT WRAPPER (Phone Screen) -->
<main class="relative z-20 w-full max-w-md h-full flex flex-col px-4">
<!-- Expanded Dynamic Island -->
<!-- This mimics the expanded state: anchored to top, rounded significantly, black background -->
<div class="w-full bg-black rounded-[2.5rem] p-6 shadow-2xl ring-1 ring-white/10 transition-all duration-300 ease-out flex flex-col gap-6 mt-2 relative overflow-hidden">
<!-- Dynamic Island Background Glow Effect -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-24 bg-primary/20 blur-[60px] rounded-full pointer-events-none"></div>
<!-- Top Row: Artwork + Info + Waveform -->
<div class="flex items-center gap-5 relative z-10">
<!-- Album Art -->
<div class="relative w-20 h-20 shrink-0 group">
<img alt="Album Cover Art" class="w-full h-full object-cover rounded-2xl shadow-lg ring-1 ring-white/10" data-alt="Abstract colorful fluid art album cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUdARdjo17AFmQDATi4pL5mdA5OG-WDARYhahjwwntlJ9qjAPUI-tFR_ETzD0F_7IEp0SlFX7nSacw8KAxz9txCquMl563sf6JdIyWdsJljW0rMHTBq8RVgfAt2utazxylt5gAnExos9BVGRBWblMyLatCQK4UIK9f4FhyMOQ-nDMtgmjuD14aeRUEWahxUGpQ-g1Db737L8DFxd7O_-QC3ij2EGySqiV8VHRo7zSlQ55zju4kRJgdjkkzP7Ul9nvljTFtCynF0TE"/>
<!-- Small playing indicator overlay on art -->
<div class="absolute inset-0 flex items-center justify-center bg-black/30 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-icons-round text-white text-2xl">equalizer</span>
</div>
</div>
<!-- Info & Waveform Container -->
<div class="flex flex-col flex-1 min-w-0 justify-center h-full gap-3">
<!-- Text Info -->
<div class="flex flex-col">
<div class="flex items-center gap-2">
<h2 class="text-white text-lg font-bold truncate leading-tight tracking-tight">Midnight City</h2>
<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-white/20 text-white uppercase tracking-wider">E</span>
</div>
<p class="text-white/60 text-sm font-medium truncate">M83 • Hurry Up, We're Dreaming</p>
</div>
<!-- Mini Visualizer / Waveform -->
<div class="flex items-center gap-1 h-6 w-full opacity-80">
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
</div>
</div>
</div>
<!-- Progress Bar -->
<div class="flex flex-col gap-2 relative z-10 group">
<div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden relative cursor-pointer">
<!-- Progress Fill -->
<div class="absolute top-0 left-0 h-full w-[65%] bg-gradient-to-r from-white to-white/80 rounded-full"></div>
<!-- Current Time Indicator Dot -->
<div class="absolute top-1/2 -translate-y-1/2 left-[65%] w-3 h-3 bg-white rounded-full shadow-md scale-0 group-hover:scale-100 transition-transform duration-200"></div>
</div>
<div class="flex justify-between text-[11px] font-medium text-white/40 font-mono tracking-wide">
<span>2:34</span>
<span>-1:29</span>
</div>
</div>
<!-- Bottom Row: Controls -->
<div class="flex items-center justify-between relative z-10 pt-1">
<!-- Left Secondary Action -->
<button class="w-10 h-10 flex items-center justify-center rounded-full text-white/50 hover:text-primary hover:bg-white/5 transition-colors">
<span class="material-icons-round text-2xl">shuffle</span>
</button>
<!-- Main Playback Controls -->
<div class="flex items-center gap-6">
<button class="text-white hover:text-white/80 transition-colors active:scale-95 transform">
<span class="material-icons-round text-4xl">skip_previous</span>
</button>
<button class="w-16 h-16 flex items-center justify-center rounded-full bg-white text-black hover:scale-105 active:scale-95 transition-all shadow-[0_0_20px_rgba(255,255,255,0.3)]">
<span class="material-icons-round text-4xl ml-1">play_arrow</span>
</button>
<button class="text-white hover:text-white/80 transition-colors active:scale-95 transform">
<span class="material-icons-round text-4xl">skip_next</span>
</button>
</div>
<!-- Right Secondary Action (Airplay) -->
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary hover:text-primary hover:bg-primary/10 transition-colors relative">
<span class="material-icons-round text-2xl">airplay</span>
<span class="absolute top-2 right-2 w-2 h-2 bg-green-500 rounded-full border border-black"></span>
</button>
</div>
</div>
<!-- Simulated Content Below (To show context) -->
<div class="mt-8 px-2 opacity-40 select-none pointer-events-none grayscale">
<h3 class="text-white text-2xl font-bold mb-6">Up Next</h3>
<!-- List Item 1 -->

<div class="flex-1">
<div class="h-4 w-32 bg-white/20 rounded mb-2"></div>
<div class="h-3 w-20 bg-white/10 rounded"></div>
</div>
<div class="h-8 w-8 rounded-full border border-white/10"></div>
</div>
<!-- List Item 2 -->
<div class="flex items-center gap-4 mb-6">
<span class="text-white/40 font-mono text-sm">02</span>
<img alt="Next song cover" class="w-12 h-12 rounded-lg object-cover" data-alt="Nature landscape album cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAaPbtmdW6Ne4eC3sE-QNZ4Iu1AArEglfWkPDm9VtCYdIFAyHbwB6XgobW6JWbm7KtVyJvd4EzytK_fxAGDNtLew2AYJCAs1f6G9-Vh83Cv2TUFosTW5PJstKUa3L2oRTFxeb7VS2kvZiWVA_dx3Rz0I93q6rjfRwStV5VHU-P1mRqcVBpVO57KDvHJ19d-iRX6EwuHZRLjOB7qSr2WQ4T606gUXqeNw3wLrHhspAIRVbJ1w2sxxq9kScMR1tsCtIdDaEiKe5jkXPk"/>
<div class="flex-1">
<div class="h-4 w-40 bg-white/20 rounded mb-2"></div>
<div class="h-3 w-24 bg-white/10 rounded"></div>
</div>
<div class="h-8 w-8 rounded-full border border-white/10"></div>
</div>
<!-- List Item 3 -->
<div class="flex items-center gap-4 mb-6">
<span class="text-white/40 font-mono text-sm">03</span>
<img alt="Next song cover" class="w-12 h-12 rounded-lg object-cover" data-alt="Party scene album cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFChiY22en5eWtdsdyUdULfx6va12ooSrPYbqHADacXb9VEz1ONVsdNfKqpL-HCc6E_3X3G3i-u2XjsW785kF12UrylhOrcu-8_EIxMHZu2xc4ekIW5vNJ5Vjk7OuS3Lqn3BiMT34n1Jj8hoYZB_GGMM8fzz6rIYY8qEq1LzqRHuhUGti-dJj04X10j_YvJTgydHO2lPjvUWaUtDCO2LLt57AypVW-2udyHyzRyTASgmCQyK_6Ephq-j_ostrNUM09ckdwhtojfds"/>
<div class="flex-1">
<div class="h-4 w-28 bg-white/20 rounded mb-2"></div>
<div class="h-3 w-16 bg-white/10 rounded"></div>
</div>
<div class="h-8 w-8 rounded-full border border-white/10"></div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Mockup) -->
<div class="fixed bottom-0 w-full bg-background-dark/90 backdrop-blur-md border-t border-white/5 py-4 px-8 z-30">
<div class="flex justify-between items-center max-w-md mx-auto">
<div class="flex flex-col items-center gap-1 text-primary">
<span class="material-icons-round">library_music</span>
<span class="text-[10px] font-medium">Library</span>
</div>
<div class="flex flex-col items-center gap-1 text-white/40">
<span class="material-icons-round">search</span>
<span class="text-[10px] font-medium">Search</span>
</div>
<div class="flex flex-col items-center gap-1 text-white/40">
<span class="material-icons-round">radio</span>
<span class="text-[10px] font-medium">Radio</span>
</div>
</div>
</div>
</body></html>
